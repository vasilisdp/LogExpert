name: Build Windows self-contained

on:
  push:
    branches: [ Development ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Check out your code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup .NET (pick the version your project targets)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # or 7.0.x / 6.0.x etc.

      # 3. Restore and build (optional but nice)
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build ${{ env.Solution }} -c Release

      # 4. Publish self-contained for Windows 64-bit
      - name: Publish win-x64 self-contained
        run: dotnet publish . \
          -c Release \
          -r win-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -o ./publish/win-x64

      # 5. Upload the published files as an artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-self-contained
          path: ./publish/win-x64
